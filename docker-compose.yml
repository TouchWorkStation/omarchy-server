# docker compose up -d   then open http://<this-machine>:7780 on your phone
services:
  umbrel-touch:
    build: .
    image: umbrel-touch:0.3.0
    container_name: umbrel-touch
    restart: unless-stopped
    ports:
      - "7780:7780"
    environment:
      # Your Umbrel's address. Leave it empty to enter it from your phone on first launch.
      UMBREL_URL: ""
    volumes:
      - umbrel-touch-data:/data
volumes:
  umbrel-touch-data:
